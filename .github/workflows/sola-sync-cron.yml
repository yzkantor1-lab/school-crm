name: Sola Sync (scheduled)

# Vercel's Hobby plan only allows cron jobs that fire once a day, which is
# too infrequent for this — GitHub Actions has no such limit, so it drives
# the same secret-protected endpoint instead (app/api/cron/sola-sync).
# GitHub doesn't guarantee exact timing under load (occasionally a few
# minutes late), which doesn't matter for a payment sync.
#
# workflow_dispatch lets a human trigger this exact same run manually from
# the Actions tab at any time, independent of the CRM's own "Run Sync"
# button (which requires being logged into the CRM).
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Sola Sync
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://www.nesivhatalmud.org/api/cron/sola-sync)
          cat /tmp/response.json
          echo
          if [ "$status" -ge 300 ]; then
            echo "Sync failed with HTTP $status"
            exit 1
          fi
